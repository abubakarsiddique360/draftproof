[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "draftproof"
dynamic = ["version"]
description = "Evidence-first, evaluation-driven publishing studio: plan, research, draft, verify, score, revise, publish."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ABU BAKAR SIDDIQUE", email = "abs2003.edu@gmail.com" }]
keywords = [
  "ai-writing",
  "multi-agent",
  "citations",
  "fact-verification",
  "content-pipeline",
  "fastapi",
  "llm",
  "evaluation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "markdown-it-py>=3.0,<5.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "pyyaml>=6.0,<7.0",
  "rich>=13.7,<16.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[project.scripts]
draftproof = "draftproof.cli:main"

[project.urls]
Homepage = "https://github.com/abubakarsiddique360/draftproof"
Repository = "https://github.com/abubakarsiddique360/draftproof"
Issues = "https://github.com/abubakarsiddique360/draftproof/issues"
Changelog = "https://github.com/abubakarsiddique360/draftproof/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/draftproof/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/draftproof"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/evals",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]
extend-exclude = ["src/draftproof/web", "docs", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "S", "ANN", "TID", "D"]
ignore = [
  "D101",  # class docstrings are documented at module level where trivial
  "D102",  # method docstrings
  "D103",  # function docstrings
  "D105",  # magic methods
  "D107",  # __init__
  "D203",
  "D213",
  "ANN401",
  "B008",
  "RUF001",
  "RUF002",
  "RUF003",
  "S104",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D103", "D100", "S105", "S106", "S311", "S108", "B011"]
"evals/**" = ["ANN", "D103"]
"src/draftproof/cli.py" = ["B008"]
"src/draftproof/providers/mock.py" = ["S311"]
"src/draftproof/providers/router.py" = ["S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["draftproof"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["draftproof"]
strict = true
warn_unreachable = true
disallow_any_generics = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*", "evals.*"]
ignore_errors = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["markdown_it.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "network: tests that would reach the public internet (excluded by default)",
  "slow: long-running end-to-end tests",
]

[tool.coverage.run]
source = ["draftproof"]
branch = true
omit = ["src/draftproof/web/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"
