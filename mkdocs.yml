site_name: DraftProof
site_description: Evidence-first, evaluation-driven publishing studio
site_url: https://github.com/abubakarsiddique360/draftproof
repo_name: abubakarsiddique360/draftproof
repo_url: https://github.com/abubakarsiddique360/draftproof
edit_uri: edit/main/docs/
copyright: MIT © 2026 ABU BAKAR SIDDIQUE

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Pipeline: pipeline.md
  - Verification: verification.md
  - Quality rubric: quality.md
  - Configuration: configuration.md
  - HTTP API: api.md
  - CLI: cli.md
  - Deployment: deployment.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

strict: true
